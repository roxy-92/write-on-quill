<div class="app-shell">
  @if (currentMode() === 'editor') {
    <app-editor
      [(text)]="text"
      (save)="saveDraft()"
      (clear)="clearText()"
    />
  }

  @if (showShareModal()) {
    <app-share-modal
      [shareUrl]="shareUrl()"
      (viewPage)="openReaderView()"
      (close)="showShareModal.set(false)"
    />
  }

  @if (currentMode() === 'read') {
    <app-reader
      [content]="text()"
      (writeOwn)="startWritingOwn()"
    />
  }
</div>
