
<div class="export-actions">

    <iconify-icon icon="lucide:file-text" aria-hidden="true"></iconify-icon>

  </button>

  <button type="button" (click)="exportMarkdown()">
    <iconify-icon icon="lucide:file-code-2" aria-hidden="true"></iconify-icon>

  <button type="button" (click)="exportPdf()">
    <iconify-icon icon="lucide:file-down" aria-hidden="true"></iconify-icon>
    PDF
  </button>
</div>
